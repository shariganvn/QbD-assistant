name: ci

on:
  push:
  pull_request:

jobs:
  qbd-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check qbd_core
      - run: python -m pytest -q
