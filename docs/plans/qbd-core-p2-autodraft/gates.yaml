# Executable acceptance gates for qbd-core-p2-autodraft.
# This file owns gate bodies. Step files describe implementation; they must not restate a gate.

version: 1
workstream: qbd-core-p2-autodraft
evidence_root: docs/reports/qbd-core-p2-autodraft

gates:
  - id: G-01
    title: Invalid input is refused
    invariant: >
      More than 3 substances, a form outside the 38, an unknown market, or an empty field is rejected with a fixed error code; a combination carries the out-of-SOP flag.
    boundary_owner: intake
    fixture: qbd_core/modules/dossier_drafting/tests/fixtures/intake/*.json
    command: >
      python -m pytest qbd_core/modules/dossier_drafting/tests/test_intake.py -q
    expected: >
      exit 0; each bad case yields its fixed code
    negative_cases:
      - each valid-looking edge (3 substances, duplicate form name) accepted or rejected as specified
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-01.txt
    owner_step: "02"
    status: pass

  - id: G-02
    title: Form catalogue is complete
    invariant: >
      38 forms map to exactly one of N1-N9 (the duplicated effervescent granule counts once); N5-N9 sections without internal documents emit CẦN DỮ LIỆU.
    boundary_owner: config
    fixture: qbd_core/modules/dossier_drafting/config/*.json
    command: >
      python -m pytest qbd_core/modules/dossier_drafting/tests/test_config.py -q
    expected: >
      38/38 mapped, 0 duplicates, 0 empty groups
    negative_cases:
      - a form mapped to two groups fails
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-02.txt
    owner_step: "02"
    status: pass

  - id: G-03
    title: No restricted document leaves the machine
    invariant: >
      Files of class B, C or unclassified never appear in any outbound payload.
    boundary_owner: egress_gate
    fixture: synthetic manifest and payloads in qbd_core/modules/egress_gate/tests/fixtures (framework); the real Kho manifest (step 03) is required to close the gate
    command: >
      python -m pytest qbd_core/modules/egress_gate -q
    expected: >
      0 leaks; every trap payload blocked
    negative_cases:
      - manifest missing or unreadable -> block all egress
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-03.txt
    owner_step: "03"
    progress: framework tests pass against a synthetic manifest (docs/reports/qbd-core-p2-autodraft/g-03-framework.txt); gate not closed until the real manifest passes the same checks
    status: unverified

  - id: G-04
    title: Every value has a source
    invariant: >
      Each covered paragraph carries a source tag that names an evidence record whose file and page match,
      whose text is the record's quote, and whose quote occurs on the cited page; each table cell holding a
      number is marked or tagged; each cited file is listed as a reference; evidence ids are unique.
      Anything else is a marked gap. The check is code and does not use a language model.
    boundary_owner: quality_gate (provenance.py)
    fixture: qbd_core/modules/quality_gate/tests/test_quality_gate.py (synthetic documents)
    command: >
      python -m pytest qbd_core/modules/quality_gate -q
    expected: >
      exit 0. The clean run passes; each planted defect (unsourced text, wrong page, changed quote, unknown
      id, forged record, number in a cell without a source, missing reference, duplicate id) is reported
      with its code and blocks the run (exit code 7 on the command line, no draft written).
    negative_cases:
      - the report never repeats draft text
      - blocked run leaves an earlier draft byte-identical
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-04.txt
    owner_step: "05"
    status: pass

  - id: G-05
    title: A failed run publishes nothing and changes nothing
    invariant: >
      Rejected input, unreadable or invalid documents, a flawed CQA confirmation, a quality block, a render
      or verification failure, a failure while staging or replacing files, and an unexpected crash all leave
      every previously published file byte-identical and leave no partial or temporary file. Files are
      published as a set (draft, quality report, page): all are replaced or none. A blocked run writes its
      report under a separate name so the last good report keeps matching the last good draft.
    boundary_owner: qbd_core/run.py + qbd_core/publish.py
    fixture: qbd_core/tests/test_pipeline_failclosed.py (synthetic documents, a published first run)
    command: >
      python -m pytest qbd_core/tests/test_pipeline_failclosed.py -q
    expected: >
      exit 0. For every injected failure the folder snapshot (path to sha256) equals the snapshot before the
      run, except a blocked run, which adds only the separate blocked report; exit codes are 2 intake or
      date, 3 combination, 4 documents, 5 CQA, 6 render, 7 blocked, 8 publish; a failed first run leaves the
      folders empty; after failures a good run still publishes.
    negative_cases:
      - second of three replacements fails -> the first is restored to its old bytes
      - staging of the second file fails -> no target touched
      - knowledge lookup raises -> nothing published
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-05.txt
    owner_step: "04"
    status: pass

  - id: G-06
    title: Runs are deterministic
    invariant: >
      The same input and date give byte-identical draft.json, quality report and HTML page across separate
      processes, hash seeds, locales, time zones, working folders and output folders, and the files hold no
      machine-specific text (no temporary or home path). A different input or date changes the files.
    boundary_owner: pipeline
    fixture: Atorvastatin calcium / Viên nén bao phim / both, synthetic documents, three environments
    command: >
      python -m pytest qbd_core/tests/test_pipeline_determinism.py -q
    expected: >
      exit 0. The three sha256 triples are equal; no path text in any file; other input or date gives other
      hashes.
    negative_cases:
      - an unsorted set in the assembler (hash-seed dependent order) -> fails
      - a timestamp in the page -> fails
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-06.txt
    owner_step: "05"
    status: pass

  - id: G-07
    title: CQA confirmation gate
    invariant: >
      The section that depends on the CQA set (P.2.2.1.2.2) stays a marked gap until a person's confirmation
      is on file and bound to this exact input (substances, form, market). A flawed confirmation (another
      input, empty or duplicate set, no name, no date, a date after the run) stops the run with a fixed
      code; it is never treated as absence. Who confirmed is a recorded claim: the code checks the record,
      not the identity.
    boundary_owner: dossier_drafting (cqa.py, assemble.py)
    fixture: qbd_core/modules/dossier_drafting/tests/test_cqa_gate.py (synthetic documents)
    command: >
      python -m pytest qbd_core/modules/dossier_drafting/tests/test_cqa_gate.py -q
    expected: >
      exit 0. No confirmation: cqa_status pending, the section is a gap whose reason names gate 3.5, draft
      valid. Valid confirmation: section covered with signer, date, the confirmed set and one open
      justification per CQA. Flawed: E_CQA_WRONG_INPUT, E_CQA_EMPTY, E_CQA_INVALID or E_CQA_UNSIGNED, exit
      code 5 on the command line, previous output file byte-identical.
    negative_cases:
      - confirmation signed for a different form or market -> E_CQA_WRONG_INPUT
      - unreadable confirmation file -> treated as not confirmed
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-07.txt
    owner_step: "04"
    status: pass

  - id: G-08
    title: Section numbering follows the market
    invariant: >
      EU yields CTD numbering, domestic yields ACTD, both yields both, per SOP appendix A.
    boundary_owner: config + quality_gate
    fixture: three market cases
    command: >
      python -m pytest qbd_core/modules/quality_gate -k numbering -q
    expected: >
      100% of sections numbered correctly
    negative_cases:
      - a missing mandatory ACTD section fails
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-08.txt
    owner_step: "05"
    progress: mapping complete and tested for the three markets (every leaf section maps, domestic requirement from the SOP note); NOT closed because the ACTD numbers come from the SOP and are not yet checked against Appendix I and TT32 (step 02.4), and the HTML headings do not print ACTD numbers yet
    status: unverified

  - id: G-09
    title: Rendered page is valid and safe
    invariant: >
      The HTML page is produced only from a draft the Stage B validator accepted, passes its own verifier
      (one scope notice, blank sign-off rows, every paragraph and gap reason present, one fixed script,
      no link out, no image), and is published only after that. Failure leaves the previous page
      byte-identical. The PDF and Word buttons work in a browser.
    boundary_owner: rendering
    fixture: slice draft from the synthetic documents; tampered pages; a browser run
    command: >
      python -m pytest qbd_core/modules/rendering -q
    expected: >
      exit 0. The browser test downloads p2-orientation-draft.doc with the notice and without the toolbar,
      the toolbar is hidden in print, a PDF is produced, no page error.
    negative_cases:
      - invalid draft -> E_* code, old page untouched, no staging folder
      - tampered page (second notice, extra script, link out, image, filled signature, removed gap text)
      - figure or image block -> E_BLOCK_UNSUPPORTED
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-09.txt
    owner_step: "05"
    status: pass

  - id: G-10
    title: Acceptance case set
    invariant: >
      All cases of step 06 reach appendix C 17/17 or N.A. with reason; out-of-scope case is declined; one case has recorded sign-off by the head of R&D.
    boundary_owner: whole system
    fixture: case list approved by the project owner
    command: >
      python -m qbd_core accept --cases <list>
    expected: >
      one report per case, none failing
    negative_cases:
      - combination and out-of-scope cases
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-10.txt
    owner_step: "06"
    status: unverified

  - id: G-11
    title: Page style follows the department sample
    invariant: >
      The HTML page carries the format tokens measured from the department's real P.2 sample (font, size,
      line spacing, heading style, table borders, header fill, risk-level colours, A4 margins, page
      number), verified in a browser and in a generated PDF, and the tokens contain no content of the
      sample.
    boundary_owner: rendering
    fixture: docs/reports/qbd-core-p2-autodraft/sample-docx/format-tokens.json (format tokens only)
    command: >
      python -m pytest qbd_core/modules/rendering -q
    expected: >
      exit 0. CSS contains every measured token; computed styles in Chromium are 10 pt, 1.5 line height,
      -1.25 cm indent on P.2.n headings, header fill rgb(166,166,166); risk cells are green, yellow and
      red.
    negative_cases:
      - a token removed from the CSS -> test names it
      - a risk level outside the outline's scale gets no fill
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/p5-6-format.txt
    owner_step: "05"
    status: pass

  - id: G-12
    title: Language-model stages are fail-closed and repeatable
    invariant: >
      A provider failure (error, empty answer, missing recording, unapproved model, egress block of the
      whole request) stops the run with exit 9 and nothing published. A model answer in the wrong shape,
      with an invented number, an unknown evidence id or a forged tag does not stop the run: that item
      or agent stays a marked gap and is never published. Evidence the egress policy does not allow is
      left out of the request, and with none left the model is not called. With a recorded provider two
      runs on the same input give identical files.
    boundary_owner: dossier_drafting + provider_access
    fixture: scripted and recorded providers over a class A and a class B document
    command: >
      python -m pytest qbd_core/tests/test_pipeline_provider.py
      qbd_core/modules/dossier_drafting/tests/test_agent_api_properties.py -q
    expected: >
      exit 0; folder snapshot unchanged for every provider failure; identical hashes for a repeated
      recorded run; class B text absent from every remote request; Stage B validator accepts the draft.
    negative_cases:
      - provider error, recorded miss, unapproved model, unreadable recording (exit 9)
      - answer not JSON, not an object, invented number, unknown id, forged tag, label outside the form
      - class A without approval, file absent from manifest, no manifest (no call)
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-12.txt
    owner_step: "04"
    scope_note: >
      Only agent 4.1 exists. The gate covers the shared path every later agent uses (ask, claim check,
      gateway), so new agents add cases rather than new rules.
    status: pass

  - id: G-13
    title: Trial-file intake is repeatable and stops on a bad file
    invariant: >
      The same trial files give identical data whatever the order given; a table is named only when
      exactly one kind matches, otherwise it is listed as not recognised with file and table number; a
      missing, corrupt, duplicate-named or wrongly shaped file stops the run (exit 10) with nothing
      published.
    boundary_owner: evidence
    fixture: minimal .docx files built in the test (qbd_core/tests/docx_factory.py)
    command: >
      python -m pytest qbd_core/modules/evidence/tests/test_trial_intake.py
      qbd_core/tests/test_pipeline_trial.py -q
    expected: exit 0; identical JSON for both file orders; exit 10 and no output folder for a bad file.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-13.txt
    owner_step: "07"
    scope_note: Intake and recognition only. No value from the data is used in a section yet.
    status: pass

  - id: G-14
    title: Every published experimental number is in its cited cell
    invariant: A number taken from the team's data carries a [dữ liệu: ...] tag and appears in that cell.
    boundary_owner: quality_gate
    fixture: draft with a tag whose cell was edited
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_data_sections.py -q
    expected: exit 0; edited number, wrong cell, wrong file or table, bare tag, unlisted file and a run without trial data are blocked.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-14.txt
    owner_step: "07"
    scope_note: First consumer is the sink-condition section (P.2.2.3.1.1).
    status: pass

  - id: G-15
    title: Calculations match hand-checked values
    invariant: f2, mean, RSD and overage come from code and match worked examples; too few points or mixed units are refused.
    boundary_owner: dossier_drafting
    fixture: worked examples with known results
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_calc.py -q
    expected: exit 0; f2 equals 64.626 for the worked example and 100 for identical profiles.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-15.txt
    owner_step: "07"
    scope_note: The functions are verified. No section publishes a calculated value yet, so no [tính] tag exists.
    status: pass

  - id: G-16
    title: Experimental data never reaches a remote destination
    invariant: no trial-table text is in any payload built for a provider.
    boundary_owner: provider_access
    fixture: run with trial files and a remote recorded provider
    command: python -m pytest qbd_core/tests/test_pipeline_trial.py -k never_reaches -q
    expected: exit 0; no payload part contains trial text.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-16.txt
    owner_step: "07"
    blocked_by: a model agent that is handed trial data; today none is, so the test holds trivially
    status: unverified

  - id: G-17
    title: Strengths come from the team's data or stay a gap
    invariant: >
      meta.strengths holds only strengths read from composition-table headers when every composition
      table agrees; a disagreement, mixed units, a strength written two ways or more strengths than the
      outline can report declare nothing and say why. The quality gate recomputes the list and blocks any
      other.
    boundary_owner: evidence + quality_gate
    fixture: minimal .docx files and the department's example report
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_strengths_from_data.py -q
    expected: exit 0; the example report gives 5 mg and 10 mg; the draft passes Stage B and the quality gate.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-17.txt
    owner_step: "07"
    status: pass

  - id: G-18
    title: Comparative dissolution f2 is computed by code and re-checked by the gate
    invariant: >
      Every f2 published in P.2.2.3.2 equals f2 recomputed from the cells its [tính: f2, ...] tag names;
      a profile with a blank cell, fewer than three usable points, no reference column or an unknown
      strength gives a marked gap row and no number; without declared strengths the section stays a gap.
    boundary_owner: dossier_drafting + quality_gate
    fixture: minimal .docx profile tables built in the test
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_dissolution.py -q
    expected: exit 0; f2 = 64.6 for the worked example; wrong value, wrong range, wrong column and a removed tag are blocked; draft passes Stage B.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-18.txt
    owner_step: "07"
    scope_note: >
      Run on the department's example report no f2 is produced, because its test columns are empty
      (a template); the notes name each table left out.
    status: pass

  - id: G-19
    title: Final formula is copied cell by cell with a tag, or left a gap
    invariant: >
      P.2.2.1.4 is filled only from a final_formula table that has at least one number, with one equal
      column group per declared strength; every copied cell carries its cell tag and a blank cell is a
      marked gap; a table with another layout, an odd column count or no numbers is reported and the
      section stays a gap. A formula table is never also counted as a composition table.
    boundary_owner: dossier_drafting + evidence
    fixture: minimal .docx formula tables built in the test, and the example report
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_final_formula.py -q
    expected: exit 0; the draft passes Stage B and the quality gate; a changed amount is blocked.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-19.txt
    owner_step: "07"
    scope_note: >
      The example report's formula table is empty, so nothing is filled from it. Amounts are copied as
      written; no proportion is calculated and no strength is declared derived.
    status: pass

  - id: G-20
    title: Reference-product table uses only columns labelled as the reference product
    invariant: >
      P.2.2.1.1 is filled only from columns whose label says reference product (RMP, reference, đối
      chiếu); the product's own columns never enter it; two different values for one row and strength
      stay a marked gap; placeholders count as empty; every copied cell carries its cell tag; with no
      labelled column the section stays a gap.
    boundary_owner: dossier_drafting
    fixture: minimal .docx tables built in the test, and the example report
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_reference_product.py -q
    expected: exit 0; the draft passes Stage B and the quality gate; a changed value is blocked.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-20.txt
    owner_step: "07"
    scope_note: >
      The example report names its reference columns by brand (Concor), so nothing is filled from it
      until its columns carry a reference word. The two dissolution-equivalence rows point to P.2.2.3.2.
    status: pass

  - id: G-21
    title: The reference product's name comes from the tables, never from the code
    invariant: >
      A brand is taken as the reference product only when a table has a column naming the substance and
      a strength beside a column naming a strength but not the substance; two different brands are not
      resolved; the choice is logged as a reviewer item with the tables it came from and whether the
      knowledge base names a source; no brand name appears in non-test code or configuration.
    boundary_owner: dossier_drafting
    fixture: minimal .docx tables with invented brand names, and the sample report
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_reference_name_from_tables.py -q
    expected: exit 0; the scan of qbd_core finds no brand name outside tests.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-21.txt
    owner_step: "07"
    scope_note: >
      On the sample report the brand is found in 10 tables and no knowledge-base source confirms it yet;
      the line for the final approver says so.
    status: pass

  - id: G-22
    title: f2 caps a dissolution value at the owner's ceiling and reads summary tables
    invariant: >
      A dissolution value above dissolution_cap_percent (config/calc_rules.json, set by the owner) counts as
      the ceiling in f2 while the cell is copied unchanged and the row says so; negative values, fewer than
      three usable points and unequal lengths are refused; a summary table (time points across, each
      product a block with an Average row) gives f2 from the Average rows; the quality gate recomputes f2
      from the cells the tag names, by column or by row, with the same cap.
    boundary_owner: dossier_drafting + quality_gate
    fixture: minimal .docx tables in both layouts, and the sample report
    command: >
      python -m pytest qbd_core/modules/dossier_drafting/tests/test_dissolution.py
      qbd_core/modules/dossier_drafting/tests/test_calc.py -q
    expected: exit 0; f2 = 64.6 for the worked example in both layouts; a wrong value, range or tag is blocked.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-22.txt
    owner_step: "07"
    scope_note: >
      The cap is an owner decision of 2026-10-22 (read as "a value above 100 % counts as 100 %"), kept in
      configuration so it can be changed or removed. The final approver should confirm it.
    status: pass

  - id: G-23
    title: Impurity profile attributes every batch to a product or stays a gap
    invariant: >
      P.2.2.3.3.1 gets a sentence per impurity only from an impurity table whose batch columns pair with
      (RRT, result) cells; each batch is tied to the reference product or the product by labels elsewhere
      in the files, a batch no label names is inherited only when the table has no more product groups than
      products found; every number is tagged; limits stay a marked gap.
    boundary_owner: dossier_drafting
    fixture: minimal .docx tables, and the sample report
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_impurity_profile.py -q
    expected: exit 0; the draft passes Stage B and the quality gate; a changed result is blocked.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-23.txt
    owner_step: "07"
    status: pass

  - id: G-24
    title: Tablet subdivision results are calculated by code from complete data and rebuilt by the gate
    invariant: >
      P.2.2.3.4 and its per-strength sections hold a mass-uniformity or mass-loss sentence only when the
      table has exactly the sample size the rule asks for; the sentence is rebuilt from the cells its
      [tính: ...] tag names and from config/subdivision_rules.json and must match word for word; the rule
      sentences in the parent section match the configuration; a report is filed under the strength its
      information table states, or the only declared strength, otherwise it is reported and left out; the
      rules are flagged as unconfirmed for the final approver.
    boundary_owner: dossier_drafting + quality_gate
    fixture: minimal .docx tables laid out as in the department's report template
    command: python -m pytest qbd_core/modules/dossier_drafting/tests/test_subdivision.py -q
    expected: exit 0; a flipped verdict, a changed count, a short range and an altered rule are blocked.
    evidence_artifact: docs/reports/qbd-core-p2-autodraft/g-24.txt
    owner_step: "07"
    scope_note: >
      Built from the department's empty report template (SAMPLE_Subdivision_of_tablets.pdf), not from a
      filled report; the first real report may need keywords added to config/trial_words.json. Sections
      5.1 (observations) and 5.4 (additional tests) of the template are not read.
    status: pass

