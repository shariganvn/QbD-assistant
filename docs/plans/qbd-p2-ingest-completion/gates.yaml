schema_version: 1
workstream: qbd-p2-ingest-completion
canonical_plan: docs/plans/qbd-p2-ingest-completion/plan.md
status_rule: all blocking gates require status=pass and a readable evidence artifact

gates:
  - id: G-01
    name: tracked-source-boundary
    requirement: A fresh checkout contains all executable ingest source.
    invariant: No executable source is stored under ignored generated-data globs.
    boundary: cowork-p2-kit/ingest and cowork-p2-kit/.gitignore
    fixture: repository index
    command: [node, --test, cowork-p2-kit/ingest/tests/repository-boundary.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - every runtime module is returned by git ls-files
        - no runtime module is returned by git check-ignore
        - npm run ingest resolves to cowork-p2-kit/ingest/cli.mjs
        - every Step 4 test, admission fixture, suite harness, design report, and retained G-01 through G-10
          evidence file is returned by git ls-files before the final suite claim
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-01.json
    owner_step: 1
    blocks: [G-03]
    status: pass

  - id: G-02
    name: record-contract-freeze
    requirement: Modularization preserves the accepted JSONL contract.
    invariant: Required fields, deterministic ID basis, provenance offsets, and default CLI behavior do not drift.
    boundary: records.schema.json and ingest contract tests
    fixture: cowork-p2-kit/ingest/tests/fixtures/contract/
    command: [node, --test, cowork-p2-kit/ingest/tests/record-contract.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - representative records match the schema and approved snapshot
        - ingested_at is absent
        - page text sliced by offsets equals quote
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-02.json
    owner_step: 1
    blocks: [G-03, G-07]
    status: pass

  - id: G-03
    name: modular-pipeline-compatibility
    requirement: Library boundaries are testable without changing happy-path behavior.
    invariant: Only the CLI maps errors to exits; libraries use injected roots/adapters and typed errors.
    boundary: cowork-p2-kit/ingest/*.mjs
    fixture: cowork-p2-kit/ingest/tests/fixtures/happy-path/
    command: [node, --test, cowork-p2-kit/ingest/tests/pipeline.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - no library module calls process.exit
        - dependency execution uses argument arrays rather than shell command strings
        - injected temp roots are honored
        - the committed non-sensitive four-DOCX happy-path fixture is copied to isolated roots
          without invoking the local input builder or LibreOffice
        - a child CLI process receives only an absolute JSON config and uses the repo-local absolute
          LiteParse binary
        - output bytes equal expected-records.jsonl; expected.json reports its 17-record SHA-256
          and LiteParse version; the three G-02 representative records remain byte-identical
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-03.json
    review_fixes:
      applied: "2026-07-21T22:20"
      findings_addressed: 14
      tests_after: "7/7 pass"
      notes: "See impl-notes post-implementation review fixes section"
    owner_step: 2
    blocks: [G-04, G-05, G-06, G-07]
    status: pass

  - id: G-04
    name: atomic-failure-preserves-store
    requirement: Failed publication never changes the prior store and records diagnostic output outside it.
    invariant: Full-schema validation, round-trip, and rename failures preserve every prior store-root byte;
      a structured failure log may exist only below the injected artifact root.
    boundary: cowork-p2-kit/ingest/publication.mjs
    fixture: isolated temp store with seeded records.jsonl
    command: [node, --test, cowork-p2-kit/ingest/tests/publication-failure.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - each injected failure returns a typed non-success result
        - before and after hashes of every store-root file are identical
        - no lock or temp file remains
        - each failure log is outside the store root and includes command, result, hashes, run identifier, and timestamp
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-04.json
    owner_step: 3
    blocks: [G-10]
    status: pass

  - id: G-05
    name: concurrent-writer-safety
    requirement: Concurrent writers cannot share or steal a temporary file.
    invariant: The first writer owns the lock and the second writer immediately returns
      E_PUBLICATION_LOCKED without ENOENT, corruption, waiting, or queueing.
    boundary: cowork-p2-kit/ingest/publication.mjs
    fixture: isolated store with two synchronized CLI processes
    command: [node, --test, cowork-p2-kit/ingest/tests/publication-concurrency.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - no shared temp path is used
        - no process deletes another process temp file
        - the second process exits nonzero with E_PUBLICATION_LOCKED before any writer-side effect
        - a well-formed lock is reclaimed only when its owner is absent and it is at least five minutes old
        - live, fresh, malformed, and indeterminate locks are rejected without store mutation
        - final store validates and no temp or stale lock remains
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-05.json
    owner_step: 3
    blocks: [G-10]
    status: pass

  - id: G-06
    name: file-boundary-security
    requirement: Input and publication paths stay within configured roots.
    invariant: Canonical configured roots contain all operations; traversal, absolute paths outside roots,
      every symlink, duplicate normalized path, unsupported extension, and shell metacharacters cannot escape policy.
    boundary: admission.mjs, liteparse-adapter.mjs, publication.mjs
    fixture: cowork-p2-kit/ingest/tests/fixtures/file-boundaries/
    command: [node, --test, cowork-p2-kit/ingest/tests/file-boundaries.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - malicious paths are rejected before parsing or writing
        - every symlink is rejected before parsing or writing
        - parser arguments are passed literally without shell evaluation
        - the configured parser binary is absolute and no PATH lookup occurs
        - every store-root file is unchanged for every rejection
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-06.json
    owner_step: 3
    blocks: [G-10]
    status: pass

  - id: G-07
    name: fail-closed-admission
    requirement: Every trust-boundary rejection is executable and isolated.
    invariant: The six named child-CLI cases (unsupported extension, missing manifest entry, non-public label,
      invalid metadata, unavailable dependency, and schema-invariant failure) exit nonzero with their specified
      IngestError code while every seeded store-root byte remains unchanged.
    boundary: admission.mjs and cli.mjs
    fixture: cowork-p2-kit/ingest/tests/fixtures/admission/
    command: [node, --test, cowork-p2-kit/ingest/tests/admission-negative.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - every named case observes a nonzero child CLI exit and its exact expected IngestError code
        - every store-root file hash before the child CLI equals its hash after the child CLI
        - the fixture hash map before all cases equals the fixture hash map after all cases
        - GATE_EVIDENCE_PATH records case, before, after, exit_code, and stderr_code for every case
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-07.json
    owner_step: 4
    blocks: [G-10]
    status: pass

  - id: G-08
    name: capability-discovery
    requirement: Optional LiteParse capabilities are discovered before use.
    invariant: A valid is-complex JSON array is available regardless of exit status, including the installed
      CLI's exit 1 complex-page result; only ENOENT or exit 127 without valid JSON is unsupported; all other
      missing or malformed results are invalid; a required parse failure blocks publication; no OCR command is issued.
    boundary: liteparse-adapter.mjs, cli.mjs, and G-08 raw evidence output
    fixture: injected runProcess unit cases plus copied happy-path inputs for the real child CLI case
    command: [node, --test, cowork-p2-kit/ingest/tests/capability-discovery.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - injected valid JSON with exits 0 and 1 is available; ENOENT/127 without valid JSON is unsupported; malformed, other nonzero, signalled, and timed-out results are invalid; required parse failure is E_PARSE
        - input-path trust-validation failure is invalid, never unsupported
        - the injected invocation recorder observes argument arrays and no ocr subcommand
        - mixed admitted outcomes aggregate as all-unsupported -> unsupported, available plus unsupported -> available, and any invalid -> invalid
        - the real product-profile DOCX precheck emits valid JSON and exits 1, then the child CLI reports isComplex available
        - G-08 snapshot retains precheck and child stdout, stderr, exit code, and parsed JSON
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-08.json
    owner_step: 4
    blocks: [G-10]
    status: pass

  - id: G-09
    name: deterministic-real-liteparse
    requirement: Identical real inputs produce byte-identical JSONL.
    invariant: Two independently rooted child CLI runs with the absolute repo-local LiteParse binary produce
      non-empty schema-valid JSONL with equal SHA-256 hashes and successful real-adapter round trips.
    boundary: full ingest pipeline
    fixture: cowork-p2-kit/ingest/tests/fixtures/happy-path/inputs/ copied into two temporary roots
    command: [node, --test, cowork-p2-kit/ingest/tests/determinism.integration.test.mjs]
    expected:
      exit_code: 0
      assertions:
        - both child CLI runs use the resolved node_modules/.bin/lit binary without adapter, runProcess, or parser injection
        - both stores are non-empty and schema-valid
        - raw JSONL hashes are identical
        - every non-empty record from each matching run output round-trips with failed equal to zero and verified greater than zero
        - committed happy-path fixture hashes remain unchanged
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-09.json
    owner_step: 4
    blocks: [G-10]
    status: pass

  - id: G-10
    name: complete-ingest-verification
    requirement: One command runs all required Phase 2 gates.
    invariant: An explicit ordered runner executes G-01 through G-10 within a 1,200,000 ms suite deadline;
      each child receives its explicit INGEST_GATE_TIMEOUT_MS budget, and suite.json records any deadline
      expiry before a child starts. No gate evidence can report pass with a missing TAP summary, timeout,
      failed/skipped/todo/cancelled test, nonzero child exit, or absent required field.
    boundary: package.json verify:ingest script and complete gate suite
    fixture: all committed ingest fixtures plus the current verify-ingest.mjs suite UUID
    command: [npm, run, verify:ingest]
    expected:
      exit_code: 0
      assertions:
        - each G-01 through G-09 evidence file has matching gate_id, status pass, exit_code 0, command, raw TAP output, timestamp, gate UUID run ID, current suite UUID, parsed TAP summary, timeout_ms, duration_ms, timed_out false, and signal
        - every G-01 through G-09 TAP summary has total greater than zero, passed equal total, and failed, skipped, todo, cancelled all equal zero
        - every G-01 through G-09 evidence has exactly the approved key set, raw_stderr, an array snapshots field, safe-integer timings, and exact TAP-summary keys; the suite runner validates G-10 evidence and final suite.json with the same strict validator before returning zero
        - repository-boundary.test.mjs asserts the exact verify:ingest script and literal ten-gate mapping, and all G-01 through G-10 evidence uses the one canonical schema
        - while G-10 runs, suite.json has the exact suite-manifest fields, matching suite UUID, status running, timed_out false, G-01 through G-09 in completed_gate_ids, next_gate_id G-10, null failed_gate_id, and null exit_code; after G-10 exits zero, verify-ingest.mjs must replace it with final status pass, all ten completed gate IDs, null next_gate_id and failed_gate_id, and exit_code 0
        - invalid timeout spellings, malformed detail snapshots, a timeout before a gate, and a timeout while the runner is in progress all retain fail evidence and cannot produce a suite pass
    evidence: docs/reports/qbd-p2-ingest-completion/gates/G-10.json
    owner_step: 4
    blocks: [G-11, G-12]
    status: pass

  - id: G-11
    name: change-impact-review
    requirement: The final diff affects only expected Phase 2 symbols and workflows.
    invariant: GitNexus change detection and manual diff review show no unexpected Phase 3 or downstream change.
    boundary: repository diff
    fixture: final uncommitted Phase 2 diff
    command: [gitnexus_detect_changes, --scope, all]
    expected:
      exit_code: 0
      assertions:
        - changed symbols match the active plan
        - unexpected affected flows are zero or explicitly approved
    evidence: artifacts/qbd-p2-ingest-completion/gates/G-11.md
    owner_step: 5
    blocks: [G-12]
    status: unverified

  - id: G-12
    name: blocking-review-closure
    requirement: A fresh code review finds no blocking Phase 2 issue.
    invariant: Review traces every requirement to fixture, command, raw result, and retained evidence.
    boundary: Phase 2 code, tests, plan, and evidence
    fixture: final diff plus G-01 through G-11 artifacts
    command: [ck:code-review, pending-changes]
    expected:
      exit_code: 0
      assertions:
        - no blocking finding remains
        - Phase 3 remains open and out of scope
        - canonical plan status matches evidence
    evidence: docs/reports/qbd-p2-ingest-completion/code-review.md
    owner_step: 5
    blocks: []
    status: unverified
